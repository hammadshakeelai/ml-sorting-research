<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Paper gradient for off-white archival feel -->
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFA" />
      <stop offset="50%" stop-color="#F7F7F3" />
      <stop offset="100%" stop-color="#F2F2EC" />
    </linearGradient>

    <!-- Subtle technical grid -->
    <pattern id="academicGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E3E3DC" stroke-width="0.5" stroke-dasharray="2,2" />
    </pattern>

    <!-- Plot gradient for CDF curve -->
    <linearGradient id="cdfGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Outer Card Frame (Off-white / Parchment with Charcoal border) -->
  <rect x="6" y="6" width="1188" height="408" rx="16" fill="url(#paperBg)" stroke="#222222" stroke-width="2.5" />
  
  <!-- Inner Academic Border Margin Line -->
  <rect x="18" y="18" width="1164" height="384" rx="12" fill="none" stroke="#D0D0C8" stroke-width="1" />

  <!-- Subtle Technical Grid on Right Hemisphere -->
  <rect x="700" y="24" width="470" height="370" fill="url(#academicGrid)" rx="8" opacity="0.75" />

  <!-- Academic Top Metadata Header -->
  <g transform="translate(48, 48)">
    <!-- Document / Paper Icon -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="22" height="28" rx="2" fill="none" stroke="#1A1A1A" stroke-width="1.8" />
      <line x1="5" y1="7" x2="17" y2="7" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" />
      <line x1="5" y1="13" x2="17" y2="13" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" />
      <line x1="5" y1="19" x2="12" y2="19" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <text x="34" y="12" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#1A1A1A" letter-spacing="1.5">RESEARCH MONOGRAPH • CS.DS / CS.LG</text>
    <text x="34" y="26" font-family="'Courier New', Courier, monospace" font-size="10" fill="#666660" letter-spacing="1">REF: ML-SORT-2026-N • PEER-ALIGNED EMPIRICAL STUDY</text>
  </g>

  <!-- Horizontal Divider Rule -->
  <line x1="48" y1="92" x2="680" y2="92" stroke="#1A1A1A" stroke-width="1.5" />

  <!-- Main Research Paper Title Section -->
  <g transform="translate(48, 142)">
    <text x="0" y="0" font-family="'Times New Roman', Times, Georgia, serif" font-size="44" font-weight="800" fill="#111111" letter-spacing="-0.5">LEARNED SORTING</text>
    <text x="0" y="44" font-family="'Times New Roman', Times, Georgia, serif" font-size="34" font-weight="600" fill="#2A2A2A" letter-spacing="-0.2">Complexity Limits &amp; O(n) Feasibility</text>
  </g>

  <!-- Abstract Summary Line -->
  <g transform="translate(48, 226)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#444440" font-weight="400">
      Distribution-aware CDF neural modeling versus standard comparison baselines:
    </text>
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#222220" font-weight="600">
      Formal proof of non-linearity, Sinkhorn bottlenecks, and high-performance C++ systems.
    </text>
  </g>

  <!-- Author & Academic Badges -->
  <g transform="translate(48, 290)">
    <!-- Author byline -->
    <text x="0" y="0" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="700" fill="#111111" letter-spacing="1">AUTHOR: HAMMAD SHAKEEL</text>
    <text x="0" y="18" font-family="'Courier New', Courier, monospace" font-size="11" fill="#666660">SYSTEMS &amp; MACHINE LEARNING RESEARCH • 2026</text>
    
    <!-- Pills / Metric Chips -->
    <g transform="translate(0, 36)">
      <!-- Pill 1: Complexity -->
      <rect x="0" y="0" width="138" height="26" rx="4" fill="#1A1A1A" />
      <text x="69" y="17" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#F8F8F4" text-anchor="middle">O(n) LINEAR TIME</text>

      <!-- Pill 2: C++ Speedup -->
      <rect x="148" y="0" width="176" height="26" rx="4" fill="#E8E8E0" stroke="#1A1A1A" stroke-width="1" />
      <text x="236" y="17" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">+33.8% vs std::sort</text>

      <!-- Pill 3: Exactness -->
      <rect x="334" y="0" width="168" height="26" rx="4" fill="#E8E8E0" stroke="#1A1A1A" stroke-width="1" />
      <text x="418" y="17" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">100% EXACT VERIFIED</text>
    </g>
  </g>

  <!-- RIGHT SIDE: Mathematical Vector Visualizer (Research Diagram Style) -->
  <g transform="translate(730, 60)">
    <!-- Chart Box Frame -->
    <rect x="0" y="0" width="410" height="295" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.8" />
    
    <!-- Chart Header -->
    <rect x="0" y="0" width="410" height="34" rx="8" fill="#F0F0EA" />
    <path d="M 0 26 L 0 34 L 410 34 L 410 26 Z" fill="#F0F0EA" />
    <line x1="0" y1="34" x2="410" y2="34" stroke="#222222" stroke-width="1.2" />
    <text x="16" y="22" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#111111" letter-spacing="1">FIG 1: CDF QUANTILE DISPATCH</text>
    <text x="320" y="22" font-family="'Courier New', Courier, monospace" font-size="10" fill="#666660">N = 3,000,000</text>

    <!-- Axes -->
    <line x1="45" y1="245" x2="385" y2="245" stroke="#333333" stroke-width="1.5" />
    <line x1="45" y1="55" x2="45" y2="245" stroke="#333333" stroke-width="1.5" />
    
    <!-- Axis Labels -->
    <text x="385" y="260" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#555550" text-anchor="end">Key Value x_i</text>
    <text x="45" y="48" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#555550">Target Rank Index</text>

    <!-- O(n log n) curve: dashed super-linear line -->
    <path d="M 45 245 Q 200 200, 375 75" fill="none" stroke="#A0A09A" stroke-width="1.8" stroke-dasharray="4,4" />
    <text x="365" y="68" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#777770" text-anchor="end">std::sort O(n log n)</text>

    <!-- O(n) LearnedSort Smooth CDF S-Curve -->
    <path d="M 45 245 C 130 245, 170 210, 210 150 C 250 90, 290 55, 375 55" fill="none" stroke="#111111" stroke-width="3" />
    <text x="270" y="130" font-family="'Courier New', monospace" font-size="11" font-weight="800" fill="#111111">LearnedSort O(n)</text>

    <!-- Quantile Knot Samples (L1 Cache Spline) -->
    <circle cx="100" cy="240" r="3.5" fill="#111111" />
    <circle cx="150" cy="225" r="3.5" fill="#111111" />
    <circle cx="185" cy="188" r="3.5" fill="#111111" />
    <circle cx="210" cy="150" r="4.5" fill="#111111" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="235" cy="112" r="3.5" fill="#111111" />
    <circle cx="270" cy="75"  r="3.5" fill="#111111" />
    <circle cx="330" cy="58"  r="3.5" fill="#111111" />

    <!-- Mathematical Formula Box -->
    <rect x="58" y="70" width="148" height="52" rx="4" fill="#F7F7F2" stroke="#CCCCCC" stroke-width="1" />
    <text x="68" y="90" font-family="'Times New Roman', Georgia, serif" font-size="13" font-style="italic" fill="#111111">F(x) = P(X ≤ x)</text>
    <text x="68" y="110" font-family="'Courier New', monospace" font-size="10.5" font-weight="700" fill="#1A1A1A">Bucket: ⌊(n-1)·F̂(x)⌋</text>
  </g>

  <!-- Bottom Archival Stamp & Footer -->
  <g transform="translate(48, 386)">
    <text x="0" y="0" font-family="'Courier New', Courier, monospace" font-size="10" fill="#888880">
      ARCHIVAL DIGITAL PREPRINT • TYPESET IN VECTOR SVG • OPEN-SOURCE UNDER MIT LICENSE
    </text>
    <text x="1104" y="0" font-family="'Courier New', Courier, monospace" font-size="10" fill="#888880" text-anchor="end">
      GITHUB: hammadshakeelai/ml-sorting-research
    </text>
  </g>
</svg>
